name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: stable
      - run: pnpm verify:release
      - run: pnpm verify:postgres
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: evidence/sbom.cdx.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: wrapper
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: apps/terminal-android

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/terraform

  service-image:
    strategy:
      fail-fast: false
      matrix:
        service: [api, relayer, indexer, integrations, venue-relay]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build -f deploy/Dockerfile.service --build-arg SERVICE=${{ matrix.service }} -t openbalance/${{ matrix.service }}:verify .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: openbalance/${{ matrix.service }}:verify
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  web-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build -f deploy/Dockerfile.web -t openbalance/web:verify .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: openbalance/web:verify
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
