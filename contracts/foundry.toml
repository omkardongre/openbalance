[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
